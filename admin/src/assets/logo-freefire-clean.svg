<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" fill="none">
  <defs>
    <linearGradient id="ffGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF2B2" />
      <stop offset="40%" stopColor="#FFBE32" />
      <stop offset="100%" stopColor="#FF7A00" />
    </linearGradient>
    <filter id="ffGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF7A00" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- FREE FIRE Authentic Esports Typography -->
  <g filter="url(#ffGlow)">
    <text x="10" y="38" fill="url(#ffGoldGrad)" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="34" letter-spacing="1.5px">
      FREE FIRE
    </text>
  </g>
  <!-- MAX Badge -->
  <rect x="195" y="16" width="56" height="24" rx="4" fill="#FFBE32" />
  <text x="223" y="33" fill="#000000" font-family="'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="14" text-anchor="middle" letter-spacing="1px">
    MAX
  </text>
</svg>
